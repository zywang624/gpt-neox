{
  # Stage-1 (soft alpha routing) training config for Pythia-160M with the
  # DDIM LSKV variant. Mirrors `pythia-70m-deduped_ddim_d128_w128.yml` but with
  # 160M model dims and the batch/iters/lr scaled from the existing
  # `pythia-160m-deduped_lskv_d256_w128.yml` recipe.
  #
  # Two-stage pipeline:
  #   stage 1 (this file): use_alpha_routing=true, soft mix, learns the router
  #   stage 2:             frozen alpha lookup extracted from this ckpt + hard
  #                        forward via alpha_hard_routing=true
  # See [[project-lskv-ddim-research]] for the full pipeline.

  # parallelism settings
  "pipe-parallel-size": 1,
  "model-parallel-size": 1,

  # model settings — Pythia-160M
  "num-layers": 12,
  "hidden-size": 768,
  "num-attention-heads": 12,
  "seq-length": 2048,
  "max-position-embeddings": 2048,
  "pos-emb": "rotary",
  "rotary-pct": 0.25,
  "no-weight-tying": true,
  "gpt-j-residual": true,
  "output-layer-parallelism": "column",

  # "attention-config": [[["flash"], 12]],
  "attention-config": [[["global"], 12]],

  # Disabled to match the working 160M LSKV recipe; 70M-scale enables both
  # but they have caused issues at 160M for this codebase.
  "scaled-upper-triang-masked-softmax-fusion": false,
  "bias-gelu-fusion": false,

  # init methods
  "init_method": "small_init",
  "output_layer_init_method": "wang_init",

  "optimizer": {
    "type": "Adam",
    "params": {
      "lr": 0.0006,
      "betas": [0.9, 0.95],
      "eps": 1.0e-8
    }
  },
  "min_lr": 0.00006,

  "zero_optimization": {
    "stage": 1,
    "allgather_partitions": true,
    "allgather_bucket_size": 500000000,
    "overlap_comm": true,
    "reduce_scatter": true,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": true,
    "cpu_offload": false
  },

  # batch size: 16 × 7 × 8 = 896 (mbs × gpus × gas)
  "train_micro_batch_size_per_gpu": 16,
  "gradient_accumulation_steps": 8,
  "data-impl": "mmap",
  "num_workers": 1,

  # activation checkpointing
  # NOTE: partition-activations / synchronize-each-layer are turned off because
  # use_alpha_routing threads a 3-tuple (hidden, alpha, mask) through the
  # pipeline. DeeperSpeed's partition_activations path only restores the first
  # tensor's shape; alpha gets its dims collapsed and forward fails. With
  # model-parallel-size=1 these two flags don't actually save any memory
  # (there's nothing to partition across MP ranks), so disabling them is free.
  "checkpoint-activations": true,
  "checkpoint-num-layers": 1,
  "partition-activations": false,
  "synchronize-each-layer": false,

  # regularization
  "gradient_clipping": 1.0,
  "weight-decay": 0.1,
  "hidden-dropout": 0,
  "attention-dropout": 0,

  # precision settings
  "fp16": {
    "fp16": true,
    "enabled": true,
    "loss_scale": 0,
    "loss_scale_window": 1000,
    "initial_scale_power": 12,
    "hysteresis": 2,
    "min_loss_scale": 1
  },

  # ~10B Pile-dedup tokens (896 × 2048 × 5450 ≈ 10.0B) — same token budget as
  # the 70M arc1e-3 run (256 × 2048 × 19073 ≈ 10.0B).
  "train-iters": 5450,
  "lr-decay-iters": 5450,
  "distributed-backend": "nccl",
  "lr-decay-style": "cosine",
  "warmup": 0.01,
  "checkpoint-factor": 1000,
  "extra-save-iters": [0,1,2,4,8,16,32,64,128,256,512],
  "eval-interval": 1000,
  "eval-iters": 10,

  "log-interval": 10,
  "steps_per_print": 10,
  "wall_clock_breakdown": true,

  "train-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "valid-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "test-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],

  "tokenizer-type": "HFTokenizer",
  "vocab-file": "/workspace/pythia/pythia_pile_idxmaps/20B_tokenizer.json",

  "launcher": "slurm",
  "deepspeed_slurm": false,

  "save": "/workspace/pythia_160m_ddim_d192_w128_bs896_arc1e-3_checkpoints",
  "load": "/workspace/pythia_160m_ddim_d192_w128_bs896_arc1e-3_checkpoints",
  "checkpoint_validation_with_forward_pass": False,

  # ===== existing lskv knobs (must be present for transformer_ddim) =====
  # d=192 keeps the 1/4 bottleneck-to-hidden ratio of the 70M DDIM run
  # (128 / 512 = 1/4). Half-bottleneck is 96, both even (required).
  "lskv_window_size": 128,
  "lskv_bottleneck_dim": 192,

  # ===== alpha-routing knobs (stage 1: soft, learn the router) =====
  "use_alpha_routing": true,
  "alpha_reg_coef": 0.001,
  "alpha_hard_inference": false,
  # Unused in this (soft) config — forward never thresholds alpha. Declared
  # here so every alpha-routing yml carries the same set of knobs and the
  # field is discoverable regardless of stage.
  "alpha_hard_threshold": 0.5,

  "global_num_gpus": 7,
  "include": "localhost:1,2,3,4,5,6,7",
  # "include": "localhost:0,1,2,3,4,5,6",
}
