{
  # parallelism settings
  "pipe-parallel-size": 1,
  "model-parallel-size": 1,

  # model settings
  "num-layers": 24,
  "hidden-size": 1024,
  "num-attention-heads": 16,
  "seq-length": 2048,
  "max-position-embeddings": 2048,
  "pos-emb": "rotary",
  "rotary-pct": 0.25,
  "no-weight-tying": true,
  "gpt-j-residual": true,
  "output-layer-parallelism": "column",

  # "attention-config": [[["flash"], 24]],
  "attention-config": [[["global"], 24]],

  # disabled — matches the working 160M+ LSKV/DDIM reference; fusion flags
  # interact poorly with the DDIM 3-tuple pipeline at this scale.
  "scaled-upper-triang-masked-softmax-fusion": false,
  "bias-gelu-fusion": false,

  # init methods
  "init_method": "small_init",
  "output_layer_init_method": "wang_init",

  "optimizer": {
    "type": "Adam",
    "params": {
      "lr": 0.0003,
      "betas": [0.9, 0.95],
      "eps": 1.0e-8
    }
  },
  "min_lr": 0.00003,

  "zero_optimization": {
    "stage": 1,
    "allgather_partitions": true,
    "allgather_bucket_size": 500000000,
    "overlap_comm": true,
    "reduce_scatter": true,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": true,
    "cpu_offload": false
  },

  # batch size: 16 × 8 × 7 = 896
  "train_micro_batch_size_per_gpu": 16,
  "gradient_accumulation_steps": 8,
  "data-impl": "mmap",
  "num_workers": 1,

  # activation checkpointing
  # NOTE: partition-activations / synchronize-each-layer MUST be false for DDIM.
  # use_alpha_routing threads a 3-tuple (hidden, alpha, mask) through the
  # pipeline; DeepSpeed's partition_activations path only restores the first
  # tensor's shape, collapsing alpha's dims and crashing forward.
  "checkpoint-activations": true,
  "checkpoint-num-layers": 1,
  "partition-activations": false,
  "synchronize-each-layer": false,

  # regularization
  "gradient_clipping": 1.0,
  "weight-decay": 0.1,
  "hidden-dropout": 0,
  "attention-dropout": 0,

  # precision settings
  "fp16": {
    "fp16": true,
    "enabled": true,
    "loss_scale": 0,
    "loss_scale_window": 1000,
    "initial_scale_power": 12,
    "hysteresis": 2,
    "min_loss_scale": 1
  },

  # 5450 iters × bs896 × 2048 ≈ 10B tokens (same budget as 70M/160M)
  "train-iters": 5450,
  "lr-decay-iters": 5450,
  "distributed-backend": "nccl",
  "lr-decay-style": "cosine",
  "warmup": 0.01,
  "checkpoint-factor": 1000,
  "extra-save-iters": [0,1,2,4,8,16,32,64,128,256,512],
  "eval-interval": 1000,
  "eval-iters": 10,

  "log-interval": 10,
  "steps_per_print": 10,
  "wall_clock_breakdown": true,

  "train-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "valid-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "test-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],

  "tokenizer-type": "HFTokenizer",
  "vocab-file": "/workspace/pythia/pythia_pile_idxmaps/20B_tokenizer.json",

  "launcher": "slurm",
  "deepspeed_slurm": false,

  "save": "/workspace/pythia_410m_ddim_d256_w128_bs896_arc1e-3_checkpoints",
  "load": "/workspace/pythia_410m_ddim_d256_w128_bs896_arc1e-3_checkpoints",
  "checkpoint_validation_with_forward_pass": False,

  # ===== LSKV dims =====
  # d=256 = hidden/4 (1024/4), same 1/4 compression ratio as 70M (d=128) and 160M (d=192).
  # half_d = 128 (even, required).
  "lskv_window_size": 128,
  "lskv_bottleneck_dim": 256,

  # ===== alpha-routing knobs (stage 1 — soft) =====
  "use_alpha_routing": true,
  "alpha_reg_coef": 0.001,
  "alpha_hard_inference": false,
  # Unused in soft mode — forward never thresholds alpha. Declared here so
  # every alpha-routing yml carries a uniform set of knobs.
  "alpha_hard_threshold": 0.5,

  "global_num_gpus": 7,
  "include": "localhost:1,2,3,4,5,6,7",
}
