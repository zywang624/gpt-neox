  "hidden-dropout": 0,
  "attention-dropout": 0,
  "fp16": {
    "fp16": true, "enabled": true, "loss_scale": 0, "loss_scale_window": 1000,
    "initial_scale_power": 12, "hysteresis": 2, "min_loss_scale": 1
  },
  "train-iters": 19000,
  "lr-decay-iters": 2000,
  "distributed-backend": "nccl",
  "lr-decay-style": "constant",
  "warmup": 0,
  "checkpoint-factor": 200,
  "extra-save-iters": [0, 100, 200, 500, 1000, 1500, 2000],
  "eval-interval": 200,
  "eval-iters": 10,
  "log-interval": 10,
  "steps_per_print": 10,
  "wall_clock_breakdown": true,
  "train-data-paths": ["/workspace/pythia/pythia_deduped_pile_idxmaps/pile_0.87_deduped_text_document"],
  "valid-data-paths": ["/workspace/pythia/pythia_deduped_pile_idxmaps/pile_0.87_deduped_text_document"],
