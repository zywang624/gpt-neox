{
  # === 160M Uniform (lskv window=0, bottleneck=192, GELU+bias) ===
  # Faithful mirror of pythia-160m-deduped_lskv_d192_w128.yml (160M DAR), ONLY
  # lskv_window_size 128 -> 0 + save path. lskv_use_act: true => submission-form
  # bottleneck (Linear+GELU+Linear, bias=True). Same 5450-step / bs896 budget.

  # parallelism settings
  "pipe-parallel-size": 1,
  "model-parallel-size": 1,

  # model settings
  "num-layers": 12,
  "hidden-size": 768,
  "num-attention-heads": 12,
  "seq-length": 2048,
  "max-position-embeddings": 2048,
  "pos-emb": "rotary",
  "rotary-pct": 0.25,
  "no-weight-tying": true,
  "gpt-j-residual": true,
  "output-layer-parallelism": "column",

  # "attention-config": [[["flash"], 12]],
  "attention-config": [[["global"], 12]],

  "scaled-upper-triang-masked-softmax-fusion": false,
  "bias-gelu-fusion": false,

  # init methods
  "init_method": "small_init",
  "output_layer_init_method": "wang_init",

  "optimizer": {
    "type": "Adam",
    "params": {
      "lr": 0.0006,
      "betas": [0.9, 0.95],
      "eps": 1.0e-8
    }
  },
  "min_lr": 0.00006,

  "zero_optimization": {
    "stage": 1,
    "allgather_partitions": true,
    "allgather_bucket_size": 500000000,
    "overlap_comm": true,
    "reduce_scatter": true,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": true,
    "cpu_offload": false
  },

  # batch size (trained on 7 gpus)
  "train_micro_batch_size_per_gpu": 16,
  # "gas": 4,   # 1
  "gradient_accumulation_steps": 8,
  "data-impl": "mmap",
  "num_workers": 1,

  # activation checkpointing
  "checkpoint-activations": true,
  "checkpoint-num-layers": 1,
  "partition-activations": true,
  "synchronize-each-layer": true,

  # regularization
  "gradient_clipping": 1.0,
  "weight-decay": 0.1,
  "hidden-dropout": 0,
  "attention-dropout": 0,

  # precision settings
  "fp16": {
    "fp16": true,
    "enabled": true,
    "loss_scale": 0,
    "loss_scale_window": 1000,
    "initial_scale_power": 12,
    "hysteresis": 2,
    "min_loss_scale": 1
  },

  "train-iters": 5450,                 # original: 143000,
  "lr-decay-iters": 5450,              # original: 143000,
  "distributed-backend": "nccl",
  "lr-decay-style": "cosine",
  "warmup": 0.01,
  "checkpoint-factor": 1000,
  "extra-save-iters": [0,1,2,4,8,16,32,64,128,256,512],
  "eval-interval": 1000,
  "eval-iters": 10,

  "log-interval": 10,
  "steps_per_print": 10,
  "wall_clock_breakdown": true,

  "train-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "valid-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "test-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],

  "tokenizer-type": "HFTokenizer",
  "vocab-file": "/workspace/pythia/pythia_pile_idxmaps/20B_tokenizer.json",

  "launcher": "slurm",
  "deepspeed_slurm": false,

  "save": "/workspace/pythia_160m_lskv_d192_w0_act_bias_checkpoints",
  # "load": "/workspace/pythia_checkpoints",
  "checkpoint_validation_with_forward_pass": False,
  "lskv_window_size": 0,
  "lskv_bottleneck_dim": 192,
  "lskv_use_act": true,          # GELU + bias=True bottleneck (submission form)

  "global_num_gpus": 7,
  # "num_gpus": 7,
  # "train_batch_size": 896,       # ← 加这行，显式写死 16 × 8 × 7 = 896
  "include": "localhost:1,2,3,4,5,6,7",
}
