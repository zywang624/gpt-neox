{
  # === 70M Vanilla seed control (seed 1235) ===
  # Faithful mirror of pythia-70m-deduped_vanilla_baseline.yml (the submitted 70M
  # vanilla, seed 1234) with ONLY: seed 1234->1235 + save/load path. NO lskv_* args,
  # so gpt2_model.py routes to the STANDARD vanilla transformer (transformer.py), NOT
  # transformer_lskv -- trainable on the `lskv` branch unchanged. Same bs256 (16x gas2
  # x 8gpu), 19073 steps, lr 1e-3, deduped-Pile: matches DAR/Uniform seed sweep budget.

  # parallelism settings
  "pipe-parallel-size": 1,
  "model-parallel-size": 1,

  # model settings
  "num-layers": 6,
  "hidden-size": 512,
  "num-attention-heads": 8,
  "seq-length": 2048,
  "max-position-embeddings": 2048,
  "pos-emb": "rotary",
  "rotary-pct": 0.25,
  "no-weight-tying": true,
  "gpt-j-residual": true,
  "output-layer-parallelism": "column",

  # "attention-config": [[["flash"], 6]],
  "attention-config": [[["global"], 6]],

  "scaled-upper-triang-masked-softmax-fusion": true,
  "bias-gelu-fusion": true,

  # init methods
  "init_method": "small_init",
  "output_layer_init_method": "wang_init",

  "optimizer": {
    "type": "Adam",
    "params": {
      "lr": 0.001,
      "betas": [0.9, 0.95],
      "eps": 1.0e-8
    }
  },
  "min_lr": 0.0001,

  "zero_optimization": {
    "stage": 1,
    "allgather_partitions": true,
    "allgather_bucket_size": 500000000,
    "overlap_comm": true,
    "reduce_scatter": true,
    "reduce_bucket_size": 500000000,
    "contiguous_gradients": true,
    "cpu_offload": false
  },

  # batch size: 16 x gas2 x 8gpu = 256
  "train_micro_batch_size_per_gpu": 16,
  "gradient_accumulation_steps": 2,
  "data-impl": "mmap",
  "num_workers": 1,

  # activation checkpointing
  "checkpoint-activations": true,
  "checkpoint-num-layers": 1,
  "partition-activations": true,
  "synchronize-each-layer": true,

  # regularization
  "gradient_clipping": 1.0,
  "weight-decay": 0.1,
  "hidden-dropout": 0,
  "attention-dropout": 0,

  # precision settings
  "fp16": {
    "fp16": true,
    "enabled": true,
    "loss_scale": 0,
    "loss_scale_window": 1000,
    "initial_scale_power": 12,
    "hysteresis": 2,
    "min_loss_scale": 1
  },

  "train-iters": 19073,                 # original: 143000,
  "lr-decay-iters": 19073,              # original: 143000,
  "distributed-backend": "nccl",
  "lr-decay-style": "cosine",
  "warmup": 0.01,
  "checkpoint-factor": 1000,
  "extra-save-iters": [0,1,2,4,8,16,32,64,128,256,512],
  "eval-interval": 1000,
  "eval-iters": 10,

  "log-interval": 10,
  "steps_per_print": 10,
  "wall_clock_breakdown": true,

  "train-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "valid-data-paths": ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],
  "test-data-paths":  ["/workspace/pythia/pythia_pile_idxmaps/pile_0.87_deduped_text_document"],

  "tokenizer-type": "HFTokenizer",
  "vocab-file": "/workspace/pythia/pythia_pile_idxmaps/20B_tokenizer.json",

  "launcher": "slurm",
  "deepspeed_slurm": false,

  "save": "/workspace/pythia_70m_vanilla_seed1235_checkpoints",
  "load": "/workspace/pythia_70m_vanilla_seed1235_checkpoints",   # = save -> resume on restart; fresh if empty
  "checkpoint_validation_with_forward_pass": False,
  "seed": 1235,
  "global_num_gpus": 8,
  "include": "localhost:0,1,2,3,4,5,6,7",
}
